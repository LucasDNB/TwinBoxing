# Arquetipos de BoxTwinZ (spec seccion 7). TODO es [PROVISIONAL]: los valores, los desvios y
# los nombres los valida Lucas. Los nombres son inventados, sin parecido con boxeadores reales.
#
# Los valores son los de sparring. Sombra y bolsa salen multiplicando el volumen y las
# combinaciones por `factor_volumen_individual` (boxtwinz.toml, 1,10 por defecto). La curva de
# ritmo la genera services/archetypes.py desde el sosten, para que sea coherente con el.
# exposicion: fraccion de golpes del rival que llegan por cada lado del usuario.
# desvio: fraccion de la media, igual para todas las metricas del arquetipo.

arquetipos:
