[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boxtwinz-api"
description = "BoxTwinZ: PWA de conteo de golpes detectados sobre el motor de BoxTwin"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Lucas Benitez" }]
dynamic = ["version"]
# Todo esto ya esta en twinboxing_env (desvio D1: sin dependencias nuevas).
dependencies = [
    "fastapi>=0.110",
    "pydantic[email]>=2.6",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
boxtwinz-worker = "boxtwinz_api.worker:main"

[tool.setuptools.dynamic]
version = { attr = "boxtwinz_api.__version__" }

[tool.setuptools.packages.find]
include = ["boxtwinz_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]
